<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Tidak ada koneksi — ReynaHub</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --ink: #101420;
      --muted: #5b6472;
      --line: #e3e6ec;
      --brand: #ff0000;
      --danger-soft: #fff1f1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f18;
        --card: #131926;
        --ink: #eef1f6;
        --muted: #9aa5b6;
        --line: #263043;
        --brand: #ff3b3b;
        --danger-soft: #241318;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px 32px;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Titlebar kustom tetap ada saat layar offline: jendela tidak memakai frame
       native, jadi area geser dan identitas harus disediakan halaman ini. */
    .chrome {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 9px;
      height: 48px;
      padding: 0 calc(152px / var(--rh-zoom, 1)) 0 13px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
    }
    .chrome .mark {
      width: 24px;
      height: 24px;
      margin: 0;
      border-radius: 6px;
      color: #111111;
      font-size: 11px;
    }
    .chrome .wordmark {
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      line-height: 1;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 18px 40px -28px rgba(15, 23, 42, .45);
      text-align: center;
    }
    .mark {
      width: 44px; height: 44px;
      margin: 0 auto 18px;
      display: grid; place-items: center;
      border-radius: 11px;
      background: var(--brand);
      color: #fff;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -.02em;
    }
    .signal {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--danger-soft);
      color: var(--brand);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .signal i {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .35; transform: scale(.75); }
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: -.01em;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--ink);
      color: var(--card);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s ease;
    }
    button:hover { opacity: .88; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: default; }
    .status {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 11px;
      min-height: 18px;
    }
    .foot {
      margin: 22px 0 0;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }
    @media (prefers-reduced-motion: reduce) {
      .signal i { animation: none; }
    }
  </style>
</head>
<body>
  <header class="chrome" aria-label="ReynaHub">
    <span class="mark" aria-hidden="true">R</span>
    <span class="wordmark">REYNAHUB</span>
  </header>
  <main class="card">
    <div class="mark" aria-hidden="true">R</div>
    <div class="signal"><i></i> Offline</div>
    <h1>Tidak ada koneksi internet</h1>
    <p>ReynaHub memuat data dari server, jadi aplikasi ini butuh internet. Sambungkan jaringan lalu coba lagi.</p>
    <button type="button" id="retry">Coba lagi</button>
    <p class="status" id="status" role="status" aria-live="polite">Mencoba menyambung ulang otomatis tiap 5 detik…</p>
    <p class="foot">Data tidak disimpan di perangkat ini.</p>
  </main>
  <script>
    (function () {
      var btn = document.getElementById('retry');
      var status = document.getElementById('status');
      var busy = false;

      btn.addEventListener('click', async function () {
        if (busy) return;
        busy = true;
        btn.disabled = true;
        status.textContent = 'Mencoba menyambung…';
        try {
          var ok = window.reyna && typeof window.reyna.retry === 'function'
            ? await window.reyna.retry()
            : false;
          if (ok) {
            status.textContent = 'Tersambung — memuat ReynaHub…';
            return;
          }
          status.textContent = 'Belum tersambung. Periksa jaringan, lalu coba lagi.';
        } catch (e) {
          status.textContent = 'Belum tersambung. Periksa jaringan, lalu coba lagi.';
        }
        busy = false;
        btn.disabled = false;
      });
    })();
  </script>
</body>
</html>
