<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Cari tool — ReynaHub</title>
  <style>
    :root {
      --bg: #12161f;
      --panel: #171c27;
      --ink: #eef1f6;
      --muted: #8f9aab;
      --line: #232a38;
      --brand: #ff3b3b;
      --sel: #1f2735;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .head svg { color: var(--muted); flex: none; }
    input {
      flex: 1;
      min-width: 0;
      padding: 6px 2px;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
    }
    input::placeholder { color: var(--muted); }
    kbd {
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--muted);
      font: 11px/1.4 ui-monospace, monospace;
    }
    .list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      margin: 0;
      list-style: none;
    }
    .item {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: default;
    }
    .item[aria-selected="true"] { background: var(--sel); }
    .item .title {
      flex: none;
      font-weight: 600;
      white-space: nowrap;
    }
    .item .group {
      margin-left: auto;
      flex: none;
      color: var(--muted);
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .item .desc {
      flex: 1;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .empty {
      padding: 24px 16px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }
    .foot {
      display: flex;
      gap: 14px;
      padding: 9px 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11.5px;
    }
  </style>
</head>
<body>
  <div class="head">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="q" type="text" placeholder="Cari tool…" autocomplete="off" spellcheck="false" aria-label="Cari tool">
    <kbd>Esc</kbd>
  </div>
  <ul class="list" id="list" role="listbox" aria-label="Daftar tool"></ul>
  <div class="foot"><span>↑ ↓ pilih</span><span>Enter buka</span><span id="count"></span></div>
  <script>
    (function () {
      var q = document.getElementById('q');
      var list = document.getElementById('list');
      var countEl = document.getElementById('count');
      var all = [];
      var shown = [];
      var index = 0;

      function render() {
        list.textContent = '';
        if (!shown.length) {
          var empty = document.createElement('li');
          empty.className = 'empty';
          empty.textContent = 'Tidak ada tool yang cocok.';
          list.appendChild(empty);
          countEl.textContent = '0 tool';
          return;
        }
        shown.forEach(function (t, i) {
          var li = document.createElement('li');
          li.className = 'item';
          li.setAttribute('role', 'option');
          li.setAttribute('aria-selected', i === index ? 'true' : 'false');

          var title = document.createElement('span');
          title.className = 'title';
          title.textContent = t.title;
          li.appendChild(title);

          var desc = document.createElement('span');
          desc.className = 'desc';
          desc.textContent = t.desc || '';
          li.appendChild(desc);

          var group = document.createElement('span');
          group.className = 'group';
          group.textContent = t.groupLabel || t.group;  // label dari menu native
          li.appendChild(group);

          li.addEventListener('mousemove', function () {
            if (index === i) return;
            index = i;
            paint();
          });
          li.addEventListener('click', function () { choose(i); });
          list.appendChild(li);
        });
        countEl.textContent = shown.length + ' tool';
        paint();
      }

      function paint() {
        var items = list.querySelectorAll('.item');
        for (var i = 0; i < items.length; i++) {
          items[i].setAttribute('aria-selected', i === index ? 'true' : 'false');
        }
        var active = items[index];
        if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
      }

      function filter() {
        var term = q.value.toLowerCase().trim();
        shown = !term ? all.slice() : all.filter(function (t) {
          return (t.title + ' ' + (t.desc || '') + ' ' + t.hash).toLowerCase().indexOf(term) !== -1;
        });
        index = 0;
        render();
      }

      function choose(i) {
        var tool = shown[i];
        if (!tool) return;
        if (window.reyna && window.reyna.open) window.reyna.open(tool.hash);
      }

      q.addEventListener('input', filter);
      q.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (!shown.length) return;
          index = (index + 1) % shown.length;
          paint();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (!shown.length) return;
          index = (index - 1 + shown.length) % shown.length;
          paint();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          choose(index);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          if (window.reyna && window.reyna.close) window.reyna.close();
        }
      });

      (async function load() {
        try {
          all = (window.reyna && window.reyna.tools) ? await window.reyna.tools() : [];
        } catch (e) {
          all = [];
          console.warn('[reyna] daftar tool gagal dimuat', e);
        }
        filter();
        q.focus();
      })();
    })();
  </script>
</body>
</html>
